<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Essens — Ароматы, которые говорят за вас</title>
  <meta name="description" content="Премиальные духи Essens. Официальный представитель. Французские эссенции, доступные цены." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fcfaf6;
      --bg-2: #f7f2ec;
      --ink: #1a1a1a;
      --muted: #6b6357;
      --rose: #e8c3c3;
      --rose-soft: #f6e6e6;
      --gold: #c9a961;
      --gold-soft: #e9dcb8;
      --beige: #e7ddcf;
      --line: rgba(26,26,26,0.10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Montserrat', system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.55;
      overflow-x: hidden;
    }
    img { display: block; max-width: 100%; height: auto; }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }

    /* ---- HEADER ---- */
    header {
      position: sticky; top: 0; z-index: 40;
      background: rgba(252,250,246,0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; max-width: 1180px; margin: 0 auto; }
    .logo { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; letter-spacing: .06em; color: var(--ink); text-decoration: none; }
    .logo .accent { color: var(--gold); }
    .nav { display: flex; gap: 26px; font-size: 14px; }
    .nav a { color: var(--ink-2); text-decoration: none; font-weight: 500; transition: color .2s; }
    .nav a:hover { color: var(--gold); }
    .cta-top {
      padding: 10px 20px; border-radius: 999px;
      background: var(--gold); color: #1a1a1a;
      font-weight: 600; font-size: 13px; letter-spacing: .04em;
      text-decoration: none; transition: transform .2s, box-shadow .2s;
      box-shadow: 0 6px 20px rgba(201,169,97,0.3);
    }
    .cta-top:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(201,169,97,0.45); }

    /* ---- HERO ---- */
    .hero {
      padding: 110px 0 80px;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      position: relative; overflow: hidden;
    }
    .hero::before {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(900px 500px at 80% 30%, rgba(232,195,195,0.35), transparent 60%);
      pointer-events: none;
    }
    .hero-grid { display: grid; grid-template-columns: 1.05fr .95fr; gap: 50px; align-items: center; position: relative; }
    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(38px, 5.6vw, 68px);
      line-height: 1.05; font-weight: 700;
      margin-bottom: 18px; letter-spacing: -0.01em;
    }
    .hero h1 span { color: var(--gold); font-style: italic; }
    .hero p { color: var(--muted); font-size: 17px; max-width: 500px; margin-bottom: 32px; }
    .cta-hero {
      display: inline-block; padding: 15px 34px; border-radius: 999px;
      background: linear-gradient(135deg, var(--gold), #d9b878);
      color: #1a1a1a; font-weight: 600; font-size: 15px; letter-spacing: .06em;
      text-decoration: none; text-transform: uppercase;
      box-shadow: 0 12px 36px rgba(201,169,97,0.35);
      transition: transform .25s, box-shadow .25s;
    }
    .cta-hero:hover { transform: translateY(-3px); box-shadow: 0 16px 48px rgba(201,169,97,0.5); }
    .hero-visual { position: relative; }
    .bottle {
      width: 100%; max-width: 420px; margin: 0 auto; position: relative;
      animation: float 6s ease-in-out infinite;
    }
    .bottle img {
      width: 100%; height: auto; border-radius: 24px;
      box-shadow: 0 40px 90px rgba(0,0,0,0.18);
    }
    .halo {
      position: absolute; inset: -18%; z-index: -1;
      background: radial-gradient(circle at 50% 50%, rgba(232,195,195,0.6), transparent 65%);
      filter: blur(20px);
    }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
    .trust { display: flex; gap: 24px; margin-top: 24px; font-size: 13px; color: var(--muted); }
    .trust span { display: flex; align-items: center; gap: 6px; }

    /* ---- SECTIONS ---- */
    section { padding: 88px 0; }
    .section-title { text-align: center; margin-bottom: 56px; }
    .section-title .kicker { color: var(--gold); font-size: 12px; letter-spacing: .22em; text-transform: uppercase; font-weight: 600; margin-bottom: 12px; }
    .section-title h2 { font-family: 'Playfair Display', serif; font-size: clamp(28px, 4vw, 46px); font-weight: 700; margin-bottom: 12px; }
    .section-title p { color: var(--muted); max-width: 600px; margin: 0 auto; }

    .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
    .card {
      background: #fff; border: 1px solid var(--line);
      padding: 32px 26px; border-radius: 20px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.05);
      transition: transform .3s, box-shadow .3s;
    }
    .card:hover { transform: translateY(-6px); box-shadow: 0 20px 50px rgba(0,0,0,0.09); }
    .card .icon { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-size: 24px; background: var(--rose-soft); margin-bottom: 16px; }
    .card h3 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .card p { color: var(--muted); font-size: 14.5px; }

    .gallery { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
    .gcard { background: #fff; border: 1px solid var(--line); border-radius: 20px; overflow: hidden; box-shadow: 0 12px 36px rgba(0,0,0,0.05); transition: transform .3s; }
    .gcard:hover { transform: translateY(-6px); }
    .gcard img { width: 100%; height: 260px; object-fit: cover; background: var(--bg-2); }
    .gcard .info { padding: 16px 18px; }
    .gcard .name { font-family: 'Playfair Display', serif; font-size: 17px; font-weight: 700; margin-bottom: 4px; }
    .gcard .tag { color: var(--muted); font-size: 13px; }

    .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .step { text-align: center; padding: 20px 16px; }
    .step .num { font-family: 'Playfair Display', serif; font-size: 48px; font-weight: 700; color: var(--gold); margin-bottom: 8px; line-height: 1; }
    .step h3 { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
    .step p { color: var(--muted); font-size: 14.5px; }

    /* ---- footer ---- */
    footer { padding: 60px 0 30px; background: #1a1814; color: #f3efe6; }
    footer .logo { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; margin-bottom: 12px; }
    footer .logo .accent { color: var(--gold); }
    footer p { color: #c0b8a8; font-size: 14px; max-width: 360px; margin-bottom: 24px; }
    .footer-grid { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 40px; margin-bottom: 40px; }
    footer h4 { font-size: 13px; color: #fff; margin-bottom: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; }
    footer a { color: #c0b8a8; text-decoration: none; display: block; margin-bottom: 8px; font-size: 14px; transition: color .2s; }
    footer a:hover { color: var(--gold); }
    .copy { text-align: center; color: #8a8278; font-size: 12.5px; padding-top: 24px; border-top: 1px solid rgba(255,255,255,0.08); }
    .cta-gold {
      display: inline-block; padding: 13px 30px; border-radius: 999px;
      background: linear-gradient(135deg, var(--gold), #d9b878);
      color: #1a1a1a; font-weight: 700; font-size: 14px; letter-spacing: .06em;
      text-decoration: none; text-transform: uppercase;
      box-shadow: 0 8px 28px rgba(201,169,97,0.35);
      transition: transform .2s;
    }
    .cta-gold:hover { transform: translateY(-2px); }

    /* ---- reveal ---- */
    .reveal { opacity: 0; transform: translateY(24px); transition: opacity .7s ease, transform .7s ease; }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    @media (max-width: 900px) {
      nav .nav { display: none; }
      .hero-grid { grid-template-columns: 1fr; text-align: center; gap: 30px; }
      .hero p { margin: 0 auto 32px; }
      .hero-cta { justify-content: center; }
      .hero-cta .cta-hero { width: 100%; max-width: 320px; text-align: center; }
      .bottle { max-width: 320px; }
      .grid3 { grid-template-columns: 1fr; }
      .gallery { grid-template-columns: 1fr 1fr; gap: 12px; }
      .gallery .gcard img { height: 200px; }
      .steps { grid-template-columns: 1fr; }
      .footer-grid { grid-template-columns: 1fr; gap: 24px; }
      section { padding: 60px 0; }
      .trust { flex-wrap: wrap; justify-content: center; gap: 10px; }
      .rules-box { padding: 26px 20px; gap: 20px; }
    }
    @media (max-width: 520px) {
      .gallery { grid-template-columns: 1fr; gap: 12px; }
      .topbar { padding: 10px 14px; }
      .hero h1 { font-size: clamp(34px, 10vw, 44px); }
      .topbar .logo { font-size: 20px; }
      .cta-top { padding: 9px 14px; font-size: 12px; }
      .card { padding: 22px 20px; }
      .hero-cta .cta-hero { width: 100%; }
      section { padding: 48px 0; }
    }

    /* mobile hardening */
    @media (max-width: 900px) {
      .container, .wrap { padding-left: 14px !important; padding-right: 14px !important; }
      img, .gcard img, .bottle img { max-width: 100%; height: auto; }
      .hero-cta { flex-direction: column; align-items: stretch; }
      .hero-cta a { width: 100%; text-align: center; }
      section { overflow: hidden; }
    }
    @media (max-width: 520px) {
      .container, .wrap { padding-left: 12px !important; padding-right: 12px !important; }
      .nav-cta { padding: 8px 12px; font-size: 12px; }
      .footer-grid { gap: 18px; }
    }
  </style>
